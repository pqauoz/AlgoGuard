<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoGuard Legacy Simulation</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        h2 { text-align: center; color: #7f8c8d; font-weight: normal; margin-top: 0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; }
        button { grid-column: span 2; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        .result-box { margin-top: 20px; padding: 20px; border-radius: 4px; text-align: center; display: none; }
        .normal { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .attack { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .confidence { font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>AlgoGuard</h1>
    <h2>Legacy Manual Traffic Simulation</h2>

    <form id="detectForm">
        <div class="form-grid">
            <div class="form-group">
                <label>Duration (sec)</label>
                <input type="number" step="0.000001" name="dur" value="0.001234" required>
            </div>
            <div class="form-group">
                <label>Rate (pkts/sec)</label>
                <input type="number" step="0.01" name="rate" value="15.5" required>
            </div>
            <div class="form-group">
                <label>Source Packets</label>
                <input type="number" name="spkts" value="12" required>
            </div>
            <div class="form-group">
                <label>Destination Packets</label>
                <input type="number" name="dpkts" value="8" required>
            </div>
            <div class="form-group">
                <label>Source Bytes</label>
                <input type="number" name="sbytes" value="1500" required>
            </div>
            <div class="form-group">
                <label>Destination Bytes</label>
                <input type="number" name="dbytes" value="800" required>
            </div>
            <div class="form-group">
                <label>Source TTL</label>
                <input type="number" name="sttl" value="64" required>
            </div>
            <div class="form-group">
                <label>Destination TTL</label>
                <input type="number" name="dttl" value="64" required>
            </div>
            <div class="form-group">
                <label>Protocol</label>
                <select name="proto">
                    <option value="tcp">tcp</option>
                    <option value="udp">udp</option>
                    <option value="icmp">icmp</option>
                </select>
            </div>
            <div class="form-group">
                <label>State</label>
                <select name="state">
                    <option value="CON">CON</option>
                    <option value="FIN">FIN</option>
                    <option value="INT">INT</option>
                    <option value="REQ">REQ</option>
                </select>
            </div>
            <button type="submit">Analyze Network Flow</button>
        </div>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    document.getElementById("detectForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        ["dur", "rate", "spkts", "dpkts", "sbytes", "dbytes", "sttl", "dttl"].forEach(key => {
            data[key] = parseFloat(data[key]);
        });

        try {
            const response = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            const resultBox = document.getElementById("resultBox");
            resultBox.style.display = "block";

            if (result.status === "success") {
                resultBox.className = "result-box " + (result.prediction === "Attack" ? "attack" : "normal");
                resultBox.innerHTML = `
                    <h3>${result.prediction === "Attack" ? "ATTACK DETECTED" : "Normal Traffic"}</h3>
                    <div class="confidence">Model Confidence: <strong>${result.confidence}%</strong></div>
                `;
            } else {
                resultBox.className = "result-box attack";
                resultBox.innerHTML = `<h3>System Error</h3><p>${result.message}</p>`;
            }
        } catch (error) {
            alert("Failed to connect to AlgoGuard server.");
        }
    });
</script>
</body>
</html>
